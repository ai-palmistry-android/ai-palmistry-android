import 'package:flutter/material.dart';
import 'package:google_generative_ai/google_generative_ai.dart';

class PalmistryService {
  // Apni Gemini API key yahan dalein
  static const String _apiKey = 'YOUR_GEMINI_API_KEY';

  // Palmistry reading generate karne ka function
  static Future<String?> analyzePalmQuestion(String question) async {
    try {
      final model = GenerativeModel(
        model: 'gemini-1.5-flash',
        apiKey: _apiKey,
        systemInstruction: Content.system(
          'Aap ek prashidh Hastrekha Vigyan (Vedic Palmistry) visheshagya hain. '
          'User ke sawal ka uttar shuddh, vinamra aur vistrit roop me pradan karein.'
        ),
      );

      final response = await model.generateContent([
        Content.text(question),
      ]);

      return response.text;
    } catch (e) {
      debugPrint('Error generating palmistry reading: $e');
      return 'Kripya punah prayas karein: $e';
    }
  }
}
